<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>XaTuring — Territory</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #07070d; overflow: hidden; }
  #container { width: 100vw; height: 100vh; }
  #info {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    font-family: monospace; color: #cfc2f0; font-size: 13px;
    background: rgba(7,7,13,0.85); padding: 10px 14px; border-radius: 6px;
    border: 1px solid #34294f; line-height: 1.6;
  }
  #info input, #info select {
    background: #14101f; color: #e8e0fb; border: 1px solid #34294f;
    border-radius: 4px; padding: 4px 6px; font-family: monospace; font-size: 12px;
    margin-top: 4px; width: 180px;
  }
  #info label { font-size: 11px; color: #8f82b5; display: block; margin-top: 8px; }
  #loading {
    color: #cfc2f0; font-family: monospace; font-size: 14px;
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  }
  .hint { font-size: 10px; color: #6a6090; margin-top: 6px; }
</style>
</head>
<body>
<div id="info">
  <strong>XaTuring — territory</strong><br>
  <span id="counts"></span>
  <div id="freshness" style="font-size:10px;color:#6a6090;margin-top:4px;"></div>
  <label>colour by</label>
  <select id="colorMode">
    <option value="cluster">cluster (neighborhoods)</option>
    <option value="recency">recency (when visited)</option>
    <option value="hub">hub-ness (incoming links)</option>
  </select>
  <label>search</label>
  <input id="search" type="text" placeholder="type a host…" autocomplete="off" />
  <div class="hint">click a node to open the site</div>
</div>
<div id="container"><div id="loading">Loading the wake…</div></div>

<script src="https://cdn.jsdelivr.net/npm/graphology@0.25.4/dist/graphology.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sigma@2.4.0/build/sigma.min.js"></script>
<script>
fetch('graph.json')
  .then(r => r.json())
  .then(data => {
    const loadingEl = document.getElementById('loading');
    if (loadingEl) loadingEl.remove();

    const graph = new graphology.Graph({ multi: true, type: 'directed' });
    const numClusters = data.num_clusters || 1;

    // distinct hue per cluster
    function clusterColor(c) {
      const hue = (c * 137.5) % 360;   // golden-angle spacing = visually distinct
      return `hsl(${hue}, 65%, 65%)`;
    }
    // recency: dim violet (old) -> bright pink (recent)
    function recencyColor(f) {
      const light = 30 + f * 45;       // 30%..75%
      const sat = 30 + f * 50;
      return `hsl(320, ${sat}%, ${light}%)`;
    }
    function hubColor(size) {
      if (size > 12) return '#ff8bd0';
      if (size > 8)  return '#c9a0ff';
      if (size > 5)  return '#8f78d6';
      return '#5b5280';
    }

    function colorFor(n, mode) {
      if (mode === 'cluster') return clusterColor(n.cluster || 0);
      if (mode === 'recency') return n.visited ? recencyColor(n.freshness || 0) : '#2e2a40';
      return hubColor(n.size);
    }

    data.nodes.forEach(n => {
      if (!graph.hasNode(n.id)) {
        graph.addNode(n.id, {
          label: n.label, x: n.x, y: n.y, size: n.size,
          color: colorFor(n, 'cluster'),
          _cluster: n.cluster || 0,
          _freshness: n.freshness || 0,
          _visited: n.visited, _size: n.size
        });
      }
    });

    data.edges.forEach(e => {
      if (graph.hasNode(e.source) && graph.hasNode(e.target)) {
        try {
          graph.addEdge(e.source, e.target, { size: 0.3, color: 'rgba(90,70,140,0.08)' });
        } catch (err) {}
      }
    });

    document.getElementById('counts').textContent =
      `${graph.order} hosts · ${graph.size} links · ${numClusters} clusters`;

    // --- freshness marker: when generated, when next update due ---
    if (data.generated_at) {
      const gen = new Date(data.generated_at);
      const INTERVAL = 5 * 60 * 1000;  // 5 min, matches the timer
      function updateFreshness() {
        const now = new Date();
        const ageSec = Math.floor((now - gen) / 1000);
        const nextMs = INTERVAL - (now - gen);
        const fEl = document.getElementById('freshness');
        if (!fEl) return;
        let ageStr = ageSec < 60 ? `${ageSec}s ago` : `${Math.floor(ageSec/60)}m ${ageSec%60}s ago`;
        if (nextMs > 0) {
          const nextSec = Math.ceil(nextMs / 1000);
          const nextStr = nextSec < 60 ? `${nextSec}s` : `${Math.floor(nextSec/60)}m ${nextSec%60}s`;
          fEl.textContent = `generated ${ageStr} · next in ~${nextStr} (reload to see)`;
        } else {
          fEl.textContent = `generated ${ageStr} · update due — reload`;
        }
      }
      updateFreshness();
      setInterval(updateFreshness, 1000);
    }

    const renderer = new Sigma(graph, document.getElementById('container'), {
      labelColor: { color: '#e8e0fb' },
      labelSize: 12, labelWeight: 'bold',
      labelRenderedSizeThreshold: 10,
      defaultEdgeType: 'line',
      minCameraRatio: 0.02, maxCameraRatio: 20,
      hoverRenderer: (context, nodeData, settings) => {
        const size = (settings.labelSize || 12) + 1;
        const label = nodeData.label; if (!label) return;
        context.font = `bold ${size}px monospace`;
        const width = context.measureText(label).width + 16;
        const x = Math.round(nodeData.x), y = Math.round(nodeData.y);
        context.fillStyle = '#ff8bd0';
        context.fillRect(x + nodeData.size, y - size - 4, width, size + 10);
        context.fillStyle = '#1a0a14';
        context.fillText(label, x + nodeData.size + 8, y + 2);
      }
    });

    // --- colour mode switch ---
    document.getElementById('colorMode').addEventListener('change', (ev) => {
      const mode = ev.target.value;
      graph.forEachNode((node, attrs) => {
        const n = { cluster: attrs._cluster, freshness: attrs._freshness, visited: attrs._visited, size: attrs._size };
        graph.setNodeAttribute(node, 'color', colorFor(n, mode));
      });
      renderer.refresh();
    });

    // --- search highlight ---
    document.getElementById('search').addEventListener('input', (ev) => {
      const q = ev.target.value.toLowerCase().trim();
      if (!q) {
        renderer.setSetting('nodeReducer', null);
        renderer.refresh(); return;
      }
      renderer.setSetting('nodeReducer', (node, attrs) => {
        if (node.toLowerCase().includes(q))
          return { ...attrs, color: '#ffe680', size: attrs.size + 4, zIndex: 1, forceLabel: true };
        return { ...attrs, color: 'rgba(40,40,55,0.4)', label: '', zIndex: 0 };
      });
      renderer.refresh();
    });

    // --- click to open ---
    renderer.on('clickNode', ({ node }) => {
      const url = node.startsWith('http') ? node : 'https://' + node;
      window.open(url, '_blank', 'noopener');
    });

    // --- hover neighbor highlight ---
    renderer.on('enterNode', ({ node }) => {
      if (document.getElementById('search').value.trim()) return; // don't fight search
      const neighbors = new Set(graph.neighbors(node)); neighbors.add(node);
      renderer.setSetting('nodeReducer', (n, attrs) => {
        if (neighbors.has(n)) return { ...attrs, zIndex: 1 };
        return { ...attrs, color: 'rgba(40,40,55,0.4)', label: '', zIndex: 0 };
      });
      renderer.setSetting('edgeReducer', (e, attrs) => {
        if (graph.source(e) === node || graph.target(e) === node)
          return { ...attrs, color: 'rgba(255,139,208,0.5)', size: 1, zIndex: 1 };
        return { ...attrs, color: 'rgba(40,40,55,0.02)', zIndex: 0 };
      });
      renderer.refresh();
    });
    renderer.on('leaveNode', () => {
      if (document.getElementById('search').value.trim()) return;
      renderer.setSetting('nodeReducer', null);
      renderer.setSetting('edgeReducer', null);
      renderer.refresh();
    });

    renderer.getCamera().animatedReset();
  })
  .catch(err => {
    const el = document.getElementById('loading');
    if (el) el.textContent = 'Could not load graph.json: ' + err;
    console.error(err);
  });
</script>
</body>
</html>
